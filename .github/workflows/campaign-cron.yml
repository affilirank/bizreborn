name: campaign-cron

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  run-campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger campaign run
        run: |
          curl -fsS -m 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://bizreborn.com/api/prospects/campaign/run" \
            || echo "campaign run failed (non-blocking)"